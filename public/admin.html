<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog24 주문 관리자</title><link rel="stylesheet" href="/style.css"><style>
body{padding:20px}.admin{max-width:1100px;margin:auto}.loginbox,.stat,.aorder{background:#fff;border-radius:14px;padding:14px}.loginrow{display:flex;gap:8px}.loginrow input{flex:1;min-width:0;padding:12px;border:1px solid #ddd;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.stat b{display:block;font-size:20px;color:var(--pi);margin-top:6px}.toolbar,.tabs,.exports,.aactions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.toolbar button,.tabs button,.exports button,.aactions button{border:1px solid #ddd;border-radius:9px;padding:10px 12px;background:#fff;font-weight:800}.tabs button.active{background:#d9edf5}.aorder{margin:10px 0}.aorder-head{display:flex;justify-content:space-between;gap:10px}.aorder p{margin:6px 0;line-height:1.5}.prep{background:#f5b544!important}.ship{background:#6f3c91!important;color:#fff}.tracking{margin-top:8px;padding:9px;background:#f6f3f8;border-radius:9px}.hidden{display:none!important}@media(max-width:700px){body{padding:14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.loginrow{flex-direction:column}}
</style></head><body class="admin-page"><div class="admin-head"><div><h1>Blog24 스토어센터</h1><small>주문 · 배송 관리</small></div><b>관리자</b></div><main class="admin admin-shell"><h1>Blog24 주문 관리자</h1>
<section id="loginBox" class="loginbox"><b>관리자 접근</b><div class="loginrow"><input id="adminKey" type="password" placeholder="ADMIN_KEY 입력"><button id="login" class="primary">관리자 로그인</button></div><div id="loginMsg"></div></section>
<section id="panel" class="hidden"><div class="toolbar"><button id="logout">로그아웃</button></div>
<div class="admin-card"><div class="admin-card-title"><h2>매출 현황</h2></div><div id="stats" class="stats"></div></div>
<div class="admin-card"><div class="admin-card-title"><h2>배송현황 관리</h2></div><div class="admin-status-grid"><div class="admin-status"><b id="cntPaid">0</b>결제완료</div><div class="admin-status"><b id="cntPrep">0</b>배송준비</div><div class="admin-status"><b id="cntShip">0</b>배송중</div><div class="admin-status"><b id="cntDone">0</b>배송완료</div></div></div>
<div class="admin-card"><div class="admin-card-title"><h2>주문 상태별 조회</h2></div><div class="tabs"><button data-st="ALL">전체</button><button data-st="PAID">결제완료</button><button data-st="PREPARING">배송준비</button><button data-st="SHIPPED">배송중</button><button data-st="DELIVERED">배송완료</button><button data-st="CONFIRMED">구매확정</button><button data-st="REFUNDED">환불완료</button></div><div class="exports"><button id="exportCurrent">현재 목록 Excel(CSV)</button><button id="exportAll">전체 주문 Excel(CSV)</button></div></div>
<div class="admin-card"><div class="admin-card-title"><h2>주문 목록</h2></div><div id="orders"></div></div></section>
</main><script>
const $=s=>document.querySelector(s), labels={PENDING:'주문대기',PAID:'결제완료',PREPARING:'배송준비',SHIPPED:'배송중',DELIVERED:'배송완료',CONFIRMED:'구매확정',CANCELLED:'취소',REFUND_REQUESTED:'환불요청',REFUNDED:'환불완료'};let status='ALL';
const n=v=>Number(v||0).toFixed(2),dt=v=>v?new Date(v).toLocaleString('ko-KR'):'-';
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false){if(r.status===401)showLogin();throw new Error(d.error||`HTTP ${r.status}`)}return d}
function showLogin(){ $('#loginBox').classList.remove('hidden');$('#panel').classList.add('hidden') } function showPanel(){ $('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden') }
async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:$('#adminKey').value})});$('#adminKey').value='';showPanel();await load()}catch(e){$('#loginMsg').textContent=e.message}}
async function load(st=status){status=st;try{const [s,o,all]=await Promise.all([api('/api/admin/stats'),api('/api/admin/orders?status='+encodeURIComponent(status)),api('/api/admin/orders?status=ALL')]);showPanel(); const cc=k=>all.orders.filter(x=>x.order_status===k).length; $('#cntPaid').textContent=cc('PAID');$('#cntPrep').textContent=cc('PREPARING');$('#cntShip').textContent=cc('SHIPPED');$('#cntDone').textContent=cc('DELIVERED');$('#stats').innerHTML=[['오늘',s.day_sales],['이번달',s.month_sales],['올해',s.year_sales],['총매출',s.gross_sales],['순매출',s.net_sales]].map(x=>`<div class="stat">${x[0]}<b>${n(x[1])} π</b></div>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.st===status));$('#orders').innerHTML=o.orders.map(card).join('')||'<div class="aorder">해당 주문이 없습니다.</div>'}catch(e){$('#orders').innerHTML=`<div class="aorder">${e.message}</div>`}}
function card(x){const tr=x.tracking_number?`<div class="tracking"><b>배송정보</b><br>택배사: ${x.courier||'-'}<br>송장번호: ${x.tracking_number}</div>`:'';const prep=x.order_status==='PAID'?`<button class="prep" onclick="prep('${x.order_id}')">상품준비</button>`:'';const ship=['PAID','PREPARING'].includes(x.order_status)?`<button class="ship" onclick="ship('${x.order_id}')">배송등록</button>`:'';return `<div class="aorder"><div class="aorder-head"><b>${x.order_id}</b><b>${labels[x.order_status]||x.order_status}</b></div><p>${dt(x.ordered_at)} · ${n(x.paid_total)} π<br>${x.orderer_name||'-'} / ${x.orderer_phone||'-'}<br>받는분: ${x.recipient_name||'-'} / ${x.phone||'-'}<br>${x.postal_code||''} ${x.address||''} ${x.address_detail||''}</p>${tr}<div class="aactions">${prep}${ship}</div></div>`}
async function prep(id){try{await api('/api/admin/orders/'+encodeURIComponent(id)+'/preparing',{method:'POST'});await load()}catch(e){alert(e.message)}}
async function ship(id){const courier=prompt('택배사','CJ대한통운');if(courier===null)return;const trackingNumber=prompt('송장번호');if(!trackingNumber)return;try{await api('/api/admin/orders/'+encodeURIComponent(id)+'/ship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({courier,trackingNumber})});await load()}catch(e){alert(e.message)}}
$('#login').onclick=login;$('#adminKey').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}catch{}showLogin()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>load(b.dataset.st));$('#exportCurrent').onclick=()=>location.href='/api/admin/orders-export.csv?status='+encodeURIComponent(status);$('#exportAll').onclick=()=>location.href='/api/admin/orders-export.csv?status=ALL';
(async()=>{try{await api('/api/admin/session');showPanel();await load()}catch{showLogin()}})();
</script></body></html>
