<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog24 관리자</title><link rel="stylesheet" href="/style.css"><style>body{padding:20px}.admin{max-width:1100px;margin:auto}.adminbar{display:flex;gap:8px;flex-wrap:wrap}.adminbar input{flex:1;min-width:220px;padding:12px;border:1px solid #ddd;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.stat,.aorder{background:#fff;border-radius:14px;padding:14px}.stat b{display:block;font-size:20px;color:var(--pi);margin-top:6px}.alist{display:grid;gap:10px}.aorder-head{display:flex;justify-content:space-between;gap:10px}.aorder p{margin:6px 0;line-height:1.5}.aactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.aactions button{border:0;border-radius:9px;padding:9px 12px;font-weight:800}.prep{background:#f5b544}.ship{background:#6f3c91;color:#fff}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}</style></head><body><main class="admin"><h1>Blog24 주문 관리자</h1><div class="adminbar"><input id="key" type="password" placeholder="Render ADMIN_KEY 입력"><button id="load" class="primary">조회</button></div><div id="stats" class="stats"></div><div id="orders" class="alist"></div></main><script>
const key=document.querySelector('#key'),orders=document.querySelector('#orders'),stats=document.querySelector('#stats');key.value=sessionStorage.getItem('blog24_admin_key')||'';
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-key':key.value};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
const n=v=>Number(v||0).toFixed(2),dt=v=>v?new Date(v).toLocaleString('ko-KR'):'-';
async function load(){sessionStorage.setItem('blog24_admin_key',key.value);try{const [s,o]=await Promise.all([api('/api/admin/stats'),api('/api/admin/orders')]);stats.innerHTML=[['오늘',s.day_sales],['이번달',s.month_sales],['올해',s.year_sales],['총매출',s.gross_sales],['순매출',s.net_sales]].map(x=>`<div class="stat">${x[0]}<b>${n(x[1])} π</b></div>`).join('');orders.innerHTML=o.orders.map(x=>`<div class="aorder"><div class="aorder-head"><b>${x.order_id}</b><b>${x.order_status}</b></div><p>${dt(x.ordered_at)} · ${n(x.paid_total)} π<br>${x.orderer_name||'-'} / ${x.orderer_phone||'-'}<br>받는분: ${x.recipient_name} / ${x.phone}<br>${x.postal_code||''} ${x.address} ${x.address_detail||''}</p><small>Payment: ${x.payment_id||'-'}<br>TXID: ${x.txid||'-'}</small><div class="aactions"><button class="prep" onclick="prep('${x.order_id}')">상품준비</button><button class="ship" onclick="ship('${x.order_id}')">배송등록</button></div></div>`).join('')}catch(e){orders.innerHTML=`<div class="aorder">${e.message}</div>`}}
async function prep(id){await api('/api/admin/orders/'+encodeURIComponent(id)+'/preparing',{method:'POST'});load()}
async function ship(id){const courier=prompt('택배사','CJ대한통운');if(courier===null)return;const trackingNumber=prompt('송장번호');if(!trackingNumber)return;await api('/api/admin/orders/'+encodeURIComponent(id)+'/ship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({courier,trackingNumber})});load()}
document.querySelector('#load').onclick=load;
</script></body></html>
