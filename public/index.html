<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6f3c91" />
  <title>Blog24 | Pi Shopping</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Blog24</div>
      <div class="subtitle">Pi Shopping · Testnet</div>
    </div>
    <div class="top-actions"><button id="ordersBtn" class="outline hidden">주문내역</button><button id="loginBtn" class="outline">Pi 로그인</button></div>
  </header>

  <main>
    <section class="hero">
      <span class="pill">PI TESTNET</span>
      <h1>Pi로 쇼핑하는<br>Blog24</h1>
      <p>Pi Browser에서 상품을 둘러보고 Testnet 결제를 시험할 수 있는 쇼핑몰입니다.</p>
      <button id="shopBtn" class="primary">상품 보러가기</button>
    </section>

    <section id="products" class="section">
      <div class="section-title">
        <h2>추천 상품</h2>
        <span>가격 단위 π</span>
      </div>
      <div id="productGrid" class="grid"></div>
    </section>
  </main>

  <div id="cartBar" class="cartbar hidden">
    <div><strong id="cartCount">0</strong>개 상품 · <strong id="cartTotal">0</strong> π</div>
    <button id="checkoutBtn">Pi로 결제</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
